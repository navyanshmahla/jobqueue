[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobqueue"
version = "0.1.0"
description = "A job queue manager for deep learning workloads"
authors = [
    { name = "Navyansh Mahla", email = "navyanshmahla@gmail.com" }
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "rich>=10.0.0",
    "psutil>=5.8.0",
    "pynvml>=11.0.0",
]
requires-python = ">=3.7"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/navyanshmahla/jobqueue"
Issues = "https://github.com/navyanshmahla/jobqueue/issues"

[project.scripts]
jobq = "jobqueue.cli:cli" 